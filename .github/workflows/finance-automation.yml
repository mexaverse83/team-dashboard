name: Finance Automation Watchdog

# The primary scheduler is Vercel cron (vercel.json, Bearer CRON_SECRET) or,
# if enabled instead, Supabase pg_cron (supabase-2026-10-pg-cron.sql). This
# workflow only WATCHES: every 6h it reads /api/finance/health and fails —
# loudly, with an annotation — when process-recurring has not succeeded in
# 26h or any job is failing. When the processor is late it kicks it ONCE, with
# no retry, then still fails so the outage is visible. Manual dispatch can run
# the processor on demand. Re-running the processor is only duplicate-proof
# once supabase-2026-10-recurring-idempotency.sql is applied (unique indexes);
# before that the only guard is an app-level check-then-insert, so two
# overlapping runs could double-post — hence POSTs are never retried here.
#
# The repo is PUBLIC, so Actions logs are world-readable: never echo response
# bodies, item names or error text — only statuses and counts. Read details in
# the app (Settings → Automation) instead.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      run_processor:
        description: 'Also POST process-recurring now'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: finance-automation
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.FINANCE_BASE_URL || 'https://finance.autonomis.co' }}
      API_KEY: ${{ secrets.FINANCE_API_KEY }}
    steps:
      - name: Preflight — required secret present
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::FINANCE_API_KEY repository secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # GET: curl with retries only on 5xx / network errors (000); a 4xx is a
      # config problem that retrying cannot fix, so it fails immediately.
      # POST (the processor kick): exactly one attempt, never retried — a 503
      # from it is often persistent (month-close migration, write error) and a
      # timeout (000) can mean the first run is still executing on Vercel.
      - name: Define request helper
        run: |
          cat > "$RUNNER_TEMP/req.sh" <<'EOF'
          #!/usr/bin/env bash
          # usage: req.sh METHOD PATH OUTFILE → prints the final HTTP code
          method="$1"; path="$2"; out="$3"; attempt=0; max=4; timeout=120
          # Non-GET: single attempt, and wait longer than the function's 300s default limit.
          if [ "$method" != GET ]; then max=1; timeout=320; fi
          while :; do
            attempt=$((attempt+1))
            code=$(curl -sS -m "$timeout" -o "$out" -w '%{http_code}' -X "$method" "$BASE_URL$path" \
              -H "x-api-key: $API_KEY" -H 'x-automation-trigger: gha-watchdog' -H 'content-type: application/json' || true)
            code="${code:-000}"
            case "$code" in
              5??|000) if [ "$attempt" -ge "$max" ]; then echo "$code"; exit 0; fi; sleep $((attempt*attempt*5)) ;;
              *) echo "$code"; exit 0 ;;
            esac
          done
          EOF
          chmod +x "$RUNNER_TEMP/req.sh"

      - name: Run processor (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_processor }}
        run: |
          set -euo pipefail
          code=$("$RUNNER_TEMP/req.sh" POST /api/finance/process-recurring run.json)
          echo "HTTP $code"
          jq -c '{ok, total_created, errors: ((.results.errors // []) | length), warnings: ((.item_warnings // []) | length)}' run.json 2>/dev/null || echo "(unparseable response)"
          if [ "$code" != "200" ]; then
            echo "::error::process-recurring returned HTTP $code with $(jq -r '(.results.errors // []) | length' run.json 2>/dev/null || echo '?') error(s) — see the automation status in the app sidebar"
            exit 1
          fi
          warnings=$(jq '(.item_warnings // []) | length' run.json)
          if [ "$warnings" -gt 0 ]; then
            echo "::warning::process-recurring OK with $warnings item warning(s) — see the automation status in the app sidebar"
          fi
          echo "::notice::process-recurring OK — created $(jq -r '.total_created // 0' run.json)"

      - name: Check automation health
        run: |
          set -euo pipefail
          code=$("$RUNNER_TEMP/req.sh" GET /api/finance/health health.json)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::/api/finance/health returned HTTP $code"
            exit 1
          fi
          # Status words and timestamps only: error text can name subscriptions or income sources.
          jq -r '.jobs[] | "\(.job): \(.status) (last ok \(.last_ok_at // "never"))"' health.json
          problems=$(jq -r '(.problems // []) | length' health.json)
          if [ "$problems" -gt 0 ]; then
            echo "::warning::/api/finance/health reports $problems problem(s) — see the automation status in the app sidebar"
          fi
          # Compare the raw value: jq's `//` replaces false as well as null, so
          # `.cron_secret_present // true` could never read "false". Don't bring it back.
          if jq -e '.checks.cron_secret_present == false' health.json >/dev/null; then
            echo "::error::CRON_SECRET is not set in Vercel — every scheduled job gets 401"
            exit 1
          fi

          # Only the run ledger is trustworthy enough to fail on or to kick the
          # processor; inferred times (ledger not migrated yet) just warn.
          recurring=$(jq -r '.jobs[] | select(.job == "process-recurring" and .source == "ledger") | .status' health.json)
          failing=$(jq -r '[.jobs[] | select(.status == "failing" and .source == "ledger") | .job] | join(", ")' health.json)
          if [ "$(jq -r '.checks.ledger // "ok"' health.json)" = "missing" ]; then
            echo "::warning::Run ledger not migrated — job times are inferred; apply supabase-2026-10-automation-runs.sql"
          fi

          if [ "$recurring" = "late" ]; then
            echo "::error::process-recurring has not succeeded in over 26h (last ok $(jq -r '.jobs[] | select(.job == "process-recurring") | .last_ok_at // "never"' health.json)). Check CRON_SECRET in Vercel → Settings → Cron Jobs."
            kick=$("$RUNNER_TEMP/req.sh" POST /api/finance/process-recurring kick.json)
            echo "Fallback kick → HTTP $kick"
            jq -c '{ok, total_created, errors: ((.results.errors // []) | length), warnings: ((.item_warnings // []) | length)}' kick.json 2>/dev/null || echo "(unparseable response)"
            exit 1
          fi
          if [ -n "$failing" ]; then
            echo "::error::Failing automation: $failing"
            exit 1
          fi
          late=$(jq -r '[.jobs[] | select(.status == "late") | .job] | join(", ")' health.json)
          if [ -n "$late" ]; then
            echo "::warning::Late automation: $late"
          fi
          echo "::notice::Automation healthy ($(jq -r '.status' health.json))"
